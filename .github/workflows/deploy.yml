# Build and deploy the site to GitHub Pages.
#
# Every push to main runs `npm run check` (lint, format, typecheck, tests)
# and only then builds and deploys. A failing check blocks the deploy: wrong
# chemistry must not reach a student. Pull requests run the check alone.
#
# One-time setup on GitHub, which cannot be done from here:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site is served from https://<owner>.github.io/<repo>/, so the build
# needs that base path. It is derived from the repository name below; if the
# site ever moves to a custom domain, set a repository variable BASE_PATH to
# "/" (Settings → Secrets and variables → Actions → Variables).

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
